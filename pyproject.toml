[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-dl-research-agent-template"
version = "0.4.0"
description = "Token-conscious PyTorch research scaffold with phase-separated Codex workflows"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4"]

[project.scripts]
dl-sanity = "dl_research.cli.sanity:main"
dl-train = "dl_research.cli.train:main"
dl-test = "dl_research.cli.test:main"
dl-cycle = "dl_research.cli.cycle:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
